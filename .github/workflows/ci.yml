name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Same commands as `just check`. No keystore here, so the release APK is built unsigned.
      - run: ./gradlew testReleaseUnitTest lintRelease assembleRelease
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
